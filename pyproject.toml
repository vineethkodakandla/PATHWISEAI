[project]
name = "pathwise-ai"
version = "1.0.0"
description = "AI-Powered SD-WAN Management Platform"
requires-python = ">=3.11"
authors = [
    { name = "Team Pathfinders" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# ML scripts use uppercase X/y by convention (scikit-learn / numpy style)
"ml/scripts/*.py" = ["N806", "N803", "N999"]
# Test files use uppercase X/y for feature matrices
"tests/**/*.py" = ["N806", "N803"]
# Prediction-engine model uses ML naming conventions (uppercase X/y)
"services/prediction-engine/model/*.py" = ["N806", "N803"]
# Re-export shims use module-level path manipulation before imports
"services/prediction_engine_pkg/**/*.py" = ["N999", "E402"]
# Service folders have hyphens in their names (N999 is a false-positive on directory scan)
"services/*/**.py" = ["N999"]
# gNMI is a proper protocol name, CapWords rule doesn't apply
"services/telemetry-ingestion/parsers/streaming_telemetry.py" = ["N801"]

[tool.ruff.lint.isort]
known-first-party = ["app", "model", "services"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
