# docker-compose.yml

version: "3.9"

services:
  # --- Data Layer ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pathwise
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: pathwise_dev
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- SDN Controllers ---
  opendaylight:
    image: opendaylight/odl:latest
    ports:
      - "6633:6633"   # OpenFlow
      - "8181:8181"   # RESTCONF
    environment:
      FEATURES: odl-restconf,odl-l2switch-switch,odl-openflowplugin-flow-services

  # --- Network Emulation ---
  mininet:
    build: ./infra/mininet
    privileged: true
    network_mode: host
    depends_on:
      - opendaylight

  batfish:
    image: batfish/allinone:latest
    ports:
      - "9997:9997"   # Batfish API
      - "9996:9996"   # Batfish coordinator

  # --- Application Services ---
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://pathwise:pathwise_dev@timescaledb:5432/pathwise
      CORS_ORIGINS: "http://localhost:3000"

  telemetry-ingestion:
    build: ./services/telemetry-ingestion
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://pathwise:pathwise_dev@timescaledb:5432/pathwise
      POLL_INTERVAL: "1.0"
      NETFLOW_PORT: "9996"
      LOG_LEVEL: INFO

  prediction-engine:
    build: ./services/prediction-engine
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /models/best_model.pt
    volumes:
      - ./ml/checkpoints:/models

  traffic-steering:
    build: ./services/traffic-steering
    depends_on:
      redis:
        condition: service_healthy
      opendaylight:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379
      ODL_URL: http://opendaylight:8181
      SDN_TYPE: opendaylight

  digital-twin:
    build: ./services/digital-twin
    privileged: true
    depends_on:
      - mininet
      - batfish
    environment:
      BATFISH_HOST: batfish
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO

  # --- Frontend ---
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      REACT_APP_API_URL: http://localhost:8000

volumes:
  timescale_data:
